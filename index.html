<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوت حريمي قطن إسفنجي – اطلبي دلوقتي على واتساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f6; --surface:#ffffff; --ink:#2a2326; --muted:#6d6166;
  --wine:#5b1f3a; --rose:#ecd0d6; --line:#e6d9dc; --wa:#1a9d4f; --wa-ink:#fff; --fb:#2b4c9b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1519; --surface:#271e23; --ink:#f4eaed; --muted:#b7a7ad;
    --wine:#e8b6c6; --rose:#3b2530; --line:#3a2d34; --wa:#22b25c; --fb:#7f9cf0;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:17px;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hero{padding:44px 0 36px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;color:var(--muted);font-size:15px;margin:0 0 14px}
h1{font-size:clamp(32px,8.5vw,50px);line-height:1.25;font-weight:800;color:var(--wine);margin:0 0 14px}
.sub{font-size:19px;color:var(--muted);margin:0 0 22px}
.photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:16px;margin:0 0 22px;background:var(--rose)}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:12px;font:inherit;font-weight:800;font-size:18px;text-decoration:none;border:2px solid transparent}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.fb{background:transparent;color:var(--fb);border-color:var(--fb)}
.btn:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.btn:active{transform:translateY(1px)}
section{padding:36px 0;border-bottom:1px solid var(--line)}
h2{font-size:26px;font-weight:800;margin:0 0 16px}
.price{background:var(--surface);border:2px solid var(--wine);border-radius:16px;padding:22px 20px;text-align:center}
.price .one{color:var(--muted);margin:0 0 14px}
.price .one b{color:var(--ink);font-size:22px}
.price .deal{font-weight:800;color:var(--wine);font-size:20px;margin:0}
.price .big{font-size:44px;font-weight:800;line-height:1.2;display:block;color:var(--wine)}
.price s{color:var(--muted);font-weight:600;font-size:18px}
.price .btn{margin-top:16px;width:100%}
.why{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.why li{padding:12px 18px;background:var(--surface);border-radius:10px;border-inline-start:5px solid var(--wine);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.col img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.col div{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:space-between}
.col b{font-size:18px;font-weight:800}
.col .btn{min-height:46px;font-size:16px;padding:0 10px}
.size{background:var(--rose);border-radius:14px;padding:18px 20px;font-weight:600}
.steps{margin:0;padding-inline-start:24px}
.steps li{margin-bottom:8px;padding-inline-start:6px}
.final{text-align:center;background:var(--rose);border-radius:16px;padding:32px 20px;margin:36px 0;border:0}
.final h2{color:var(--wine)}
.final .btns{justify-content:center}
.final p{margin:0 0 20px}
footer{padding:6px 0 30px;color:var(--muted);font-size:15px;text-align:center}
.bar{position:fixed;inset:auto 0 0 0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:20}
.bar .btn{flex:1;min-height:48px;padding:0 10px;font-size:17px}
.bar .btn.fb{background:var(--surface)}
@media (min-width:760px){.bar{display:none}body{padding-bottom:0}.photo{aspect-ratio:1/1}}
</style>
</head>
